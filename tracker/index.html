<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#efeae3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f13" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Joseph's Week">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Joseph's Week</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <button type="button" class="nav" id="prev" aria-label="Previous week">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="titles">
      <h1>Joseph's Week</h1>
      <p class="tap">Tap a task to tick it off</p>
      <p class="range" id="range"></p>
      <button type="button" class="jump" id="jump" hidden>This week</button>
    </div>
    <button type="button" class="nav" id="next" aria-label="Next week">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <ul class="legend" id="legend" aria-label="Colour legend"></ul>
  <p class="hint" id="hint" hidden>Hold an evening cell to clear it for dinner</p>

  <div class="board" id="board">
    <div class="grid" id="grid" role="grid" aria-label="Week"></div>
  </div>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>
<script src="app.js"></script>
</body>
</html>
